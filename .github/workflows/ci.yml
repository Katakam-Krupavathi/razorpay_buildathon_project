name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovery_control_plane
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint codebase
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/recovery_control_plane?schema=public'

      - name: Run test suite
        run: npm test
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/recovery_control_plane?schema=public'
          REDIS_URL: 'redis://127.0.0.1:6379'
          NODE_ENV: 'test'
          AI_REASONING_ENABLED: 'false'
